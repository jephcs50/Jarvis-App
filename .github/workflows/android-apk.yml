name: Android APK

# Builds an installable APK on GitHub's runners (they ship with the Android SDK) and attaches it
# to a GitHub Release, so it can be downloaded straight onto a phone.
on:
  push:
    branches: [main, ccr-7a25f5c9-g4bq92]
    paths-ignore: ["server/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        # Expo's template signs release builds with the debug keystore: fine for sideloading/testing.
        # Builds all four ABIs (ARM and x86) so it installs on any Android 7.0+ phone or tablet.
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign with v1 + v2 + v3 and verify
        id: apk
        # Gradle drops the older v1 (JAR) signature for minSdk 24+, and some installers (e.g. Xiaomi
        # HyperOS) then reject the APK as "invalid package". Re-sign with apksigner, which adds v1 when
        # told the APK must verify on older API levels, keeping the 16 KB-aligned native libraries.
        run: |
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          name="Jarvis-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}.apk"
          echo "Using $tools"
          help="$("$tools/apksigner" sign --help 2>&1 || true)"
          if grep -q -- "--alignment-preserved" <<<"$help"; then align=(--alignment-preserved)
          elif grep -q -- "--lib-page-alignment" <<<"$help"; then align=(--lib-page-alignment 16384)
          else align=(); fi
          "$tools/apksigner" sign \
            --ks android/app/debug.keystore --ks-pass pass:android \
            --ks-key-alias androiddebugkey --key-pass pass:android \
            --min-sdk-version 21 \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            "${align[@]}" \
            --out "$name" android/app/build/outputs/apk/release/app-release.apk
          "$tools/apksigner" verify --verbose --min-sdk-version 21 "$name" | tee verify.txt
          grep -q "Verified using v1 scheme (JAR signing): true" verify.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" verify.txt
          "$tools/zipalign" -c -P 16 4 "$name" || echo "::warning::Native libraries are not 16 KB-aligned (only matters on 16 KB-page devices)"
          echo "path=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Publish as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="apk-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" "${{ steps.apk.outputs.path }}" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Jarvis test build ${GITHUB_RUN_NUMBER}" \
            --notes "Test APK built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Download the .apk below on your Android device and allow installing from your browser when asked."
